# Mutation area: the plugin runtime entry points (Vela.Plugins/Plugin and Retry, #448): PluginBase,
# EntityPluginBase<T>, handler resolution and invocation, the step registrar, and RetryPolicy. Run from
# tests/Vela.Tests, with Vela.Testing.Tests as a second test project (it drives the runtime through the harness).
# net462: Windows only. First Windows measurement (2026-10, Stryker 4.16, Vela.Tests only, PluginBase +
# PluginBaseOfTEntity + HandlerInvoker): ~66.7%, RetryPolicy (with the cache): ~70.8%; the #448 mutation tests target
# those survivors. Ratchet once the first full run of this area is in.
stryker-config:
  solution: ../../Vela.sln
  project: Vela.Plugins.csproj
  test-projects:
    - ./Vela.Tests.csproj
    - ../Vela.Testing.Tests/Vela.Testing.Tests.csproj
  mutate:
    - "**/Vela.Plugins/Plugin/**/*.cs"
    - "**/Vela.Plugins/Retry/**/*.cs"
  reporters: [cleartext, markdown, html, json]
  thresholds:
    high: 90
    low: 80
    break: 80
