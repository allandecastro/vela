# Mutation area: the plan diff engine and the definition normalizer. Run from tests/Vela.Cli.Tests.
# net10-only: no solution, so Stryker builds the CLI test project and what it references. `project` disambiguates
# the mutation target, since the CLI test project also references the plugin fixtures.
stryker-config:
  project: Vela.Cli.csproj
  mutate:
    - "**/DiffEngine.cs"
    - "**/DefinitionNormalizer.cs"
  reporters: [cleartext, markdown, html, json]
  thresholds:
    high: 90
    low: 85
    break: 85
