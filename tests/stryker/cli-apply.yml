# Mutation area: the apply reconciliation core (DataverseRegistration.Apply): package/assembly/type sync, the resume
# report, the stale-assembly-version guard and the ApplyDiff orchestration, driven through the IOrganizationService
# seam. Run from tests/Vela.Cli.Tests. The web-resource branches (a work-in-progress preview) are excluded with
# Stryker comments. Measured at ~80.3%; break was held at the 80 floor. The remaining survivors are equivalent
# (log-arg/culture/version fallbacks, polling-loop timing bounds, temp-dir path strings, columnsets the fake ignores).
# Full run on the self-hosted Windows runner (2026-10-11, Stryker 4.15): 83.84%; break ratcheted to 81 (~2 pts below).
stryker-config:
  project: Vela.Cli.csproj
  mutate:
    - "**/DataverseRegistration.Apply.cs"
  reporters: [cleartext, markdown, html, json]
  thresholds:
    high: 88
    low: 81
    break: 81
