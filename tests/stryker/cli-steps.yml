# Mutation area: the step reconciliation core (DataverseRegistration.Steps): the step entity build, step lookup,
# message/filter id resolution, secure-config and state reconcile, image reconcile and the stage/rank/name
# normalizers. Run from tests/Vela.Cli.Tests. Measured at ~89.4%; break was ratcheted to 87. The remaining survivors
# are equivalent (LogOperation arg strings, aliased-value reads, ternaries whose branches match on the tested inputs).
# Full run on the self-hosted Windows runner (2026-10-11, Stryker 4.15): 90.06%; break ratcheted to 88 (~2 pts below).
stryker-config:
  project: Vela.Cli.csproj
  mutate:
    - "**/DataverseRegistration.Steps.cs"
  reporters: [cleartext, markdown, html, json]
  thresholds:
    high: 94
    low: 88
    break: 88
