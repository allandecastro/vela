# Mutation area: the plugin runtime step registration (Vela.Plugins/Steps): the step builder, expression and image
# projection helpers, relationship hydration and the definition reader. Run from tests/Vela.Tests. The runtime is
# exercised by both Vela.Tests and Vela.Testing.Tests, so both are test projects. net462: Windows only (Stryker
# refuses to build .NET Framework projects elsewhere). StepApi.cs and StepBuilder.Impl.cs are generated by
# tools/codegen/Vela.StepApiGen (the CI no-diff check guards them), so they are not mutated.
stryker-config:
  solution: ../../Vela.sln
  project: Vela.Plugins.csproj
  test-projects:
    - ./Vela.Tests.csproj
    - ../Vela.Testing.Tests/Vela.Testing.Tests.csproj
  mutate:
    - "**/Vela.Plugins/Steps/**/*.cs"
    - "!**/Vela.Plugins/Steps/StepApi.cs"
    - "!**/Vela.Plugins/Steps/StepBuilder.Impl.cs"
  reporters: [cleartext, markdown, html, json]
  thresholds:
    high: 90
    low: 80
    break: 80
