name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Vela.sln
      - name: Build
        run: dotnet build Vela.sln -c Release --no-restore
      - name: Test
        run: dotnet test Vela.sln -c Release --no-build

      # Branch-coverage gates (not line coverage) on the two areas where edge-case coverage matters most:
      # the diff engine (plan/apply idempotence) and the in-memory test harness. coverlet.msbuild fails the
      # run if branch coverage drops below the threshold. Thresholds are set below current coverage so they
      # catch regressions without churn; raise them as coverage improves.
      - name: Coverage gate (branch) — diff engine
        shell: bash
        run: >
          dotnet test tests/Vela.Cli.Tests/Vela.Cli.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=90
          -p:Include="[Vela.Cli]Vela.Cli.DiffEngine%2c[Vela.Cli]Vela.Cli.DefinitionNormalizer"
      - name: Coverage gate (branch) — test harness
        shell: bash
        run: >
          dotnet test tests/Vela.Testing.Tests/Vela.Testing.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=87
          -p:Include="[Vela.Testing]*"

      # Vela.Plugins (the plugin runtime) is exercised by BOTH Vela.Tests and Vela.Testing.Tests, so its
      # coverage is the merge of the two: collect the first run to JSON, then merge the second over it and
      # apply the branch threshold to the combined result.
      - name: Coverage (collect) — plugin runtime
        shell: bash
        run: >
          dotnet test tests/Vela.Tests/Vela.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=json
          -p:Include="[Vela.Plugins]*" -p:CoverletOutput=./plugins-coverage.json
      - name: Coverage gate (branch) — plugin runtime
        shell: bash
        run: >
          dotnet test tests/Vela.Testing.Tests/Vela.Testing.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:MergeWith="$(pwd)/tests/Vela.Tests/plugins-coverage.json"
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=83
          -p:Include="[Vela.Plugins]*" -p:CoverletOutput=./plugins-merged.xml
