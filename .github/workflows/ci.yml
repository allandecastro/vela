name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same branch / PR, so successive pushes do not
# pile up redundant Windows runs (each push otherwise starts a fresh run and leaves the previous one running).
# Keyed by ref: a PR's runs cancel each other; pushes to main cancel each other; the two never interfere.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows PowerShell 5.1 is always present on the Windows runner; use it as the default shell for run steps.
defaults:
  run:
    shell: powershell

jobs:
  build-test-pack:
    # Self-hosted Windows runner: net462 (the harness) only builds on Windows, so CI must run on Windows; moved
    # off GitHub-hosted runners to avoid GitHub Actions billing. The runner must be online for checks to report.
    # Only same-repo branches (head repo == base repo) and pushes to main run CI; fork PRs are skipped.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20 # build+test is fast; cap a hung run
    env:
      # The service account can't write to the default install root 'C:\Program Files\dotnet', so setup-dotnet
      # installs into the workspace instead (it adds this to PATH for the run steps).
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Vela.sln
      - name: Build
        run: dotnet build Vela.sln -c Release --no-restore
      - name: Test
        run: dotnet test Vela.sln -c Release --no-build

      # The only check that compiles what `vela init` generates: scaffold a solution, pack the repo's
      # Vela.Plugins / Vela.Testing / Vela.Messages into a local feed, then restore + build it. Opt-in locally
      # (skipped without VELA_BUILD_SMOKE=1), always on in CI. The packs are version 1.0.0, and a 1.0.0 left in the
      # runner's persistent global NuGet cache would shadow the fresh local feed, so evict it first.
      - name: Scaffold build smoke
        env:
          VELA_BUILD_SMOKE: '1'
        run: |
          $cache = Join-Path $env:USERPROFILE '.nuget\packages'
          foreach ($p in 'vela.plugins', 'vela.testing', 'vela.messages') {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $cache "$p\1.0.0")
          }
          dotnet test tests/Vela.Cli.Tests/Vela.Cli.Tests.csproj -c Release --no-build `
            --filter "FullyQualifiedName~ProjectScaffolderTests.Generate_ThenDotnetBuild_Succeeds"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Branch-coverage gates (not line coverage): diff engine, test harness, analyzers, code fixes and the plugin
      # runtime (below). coverlet.msbuild fails the run if branch coverage drops below the threshold; every gated
      # test project must reference coverlet.msbuild, or the threshold is silently ignored. Thresholds sit just
      # below measured coverage so they catch regressions without churn; raise them as coverage improves.
      - name: Coverage gate (branch) — diff engine
        run: >
          dotnet test tests/Vela.Cli.Tests/Vela.Cli.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=90
          -p:Include="[Vela.Cli]Vela.Cli.DiffEngine%2c[Vela.Cli]Vela.Cli.DefinitionNormalizer"
      - name: Coverage gate (branch) — test harness
        run: >
          dotnet test tests/Vela.Testing.Tests/Vela.Testing.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=87
          -p:Include="[Vela.Testing]*"
      - name: Coverage gate (branch) — analyzers
        run: >
          dotnet test tests/Vela.Analyzers.Tests/Vela.Analyzers.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=80
          -p:Include="[Vela.Analyzers]*"
      - name: Coverage gate (branch) — code fixes
        run: >
          dotnet test tests/Vela.CodeFixes.Tests/Vela.CodeFixes.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=82
          -p:Include="[Vela.CodeFixes]*"

      # Vela.Plugins (the plugin runtime) is exercised by BOTH Vela.Tests and Vela.Testing.Tests, so its
      # coverage is the merge of the two: collect the first run to JSON, then merge the second over it and
      # apply the branch threshold to the combined result.
      - name: Coverage (collect) — plugin runtime
        run: >
          dotnet test tests/Vela.Tests/Vela.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=json
          -p:Include="[Vela.Plugins]*" -p:CoverletOutput=./plugins-coverage.json
      - name: Coverage gate (branch) — plugin runtime
        run: >
          dotnet test tests/Vela.Testing.Tests/Vela.Testing.Tests.csproj -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:MergeWith="${{ github.workspace }}/tests/Vela.Tests/plugins-coverage.json"
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=83
          -p:Include="[Vela.Plugins]*" -p:CoverletOutput=./plugins-merged.xml
