name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same branch / PR, so successive pushes do not
# pile up redundant Windows runs (each push otherwise starts a fresh run and leaves the previous one running).
# Keyed by ref: a PR's runs cancel each other; pushes to main cancel each other; the two never interfere.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only reads the repository. A pull request from a fork runs with a read-only token and no
# secrets (the `pull_request` event, never `pull_request_target`).
permissions:
  contents: read

# Runner: the Windows jobs run on GitHub-hosted windows-latest unless the WINDOWS_RUNNER repository variable names
# another runner as a JSON label array, e.g. `gh variable set WINDOWS_RUNNER --body '["self-hosted","Windows"]'`.
# While it is set, a pull request from a fork is skipped, so fork code never runs on that machine.

# Windows PowerShell 5.1 is always present on the Windows runner; use it as the default shell for run steps.
defaults:
  run:
    shell: powershell

jobs:
  build-test-pack:
    # Windows runner (see the note above): net462 (the harness) only builds on Windows, so CI must run on Windows. On
    # the hosted runner, pull requests from forks run too: it is ephemeral and the token is read-only. On a
    # self-hosted runner (WINDOWS_RUNNER set), they are skipped.
    if: ${{ !vars.WINDOWS_RUNNER || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"') }}
    timeout-minutes: 20 # build+test is fast; cap a hung run
    env:
      # Self-hosted only (empty on a hosted runner, which leaves setup-dotnet on its default): the runner's service
      # account can't write to 'C:\Program Files\dotnet', so setup-dotnet installs into the workspace instead (it adds
      # this to PATH for the run steps).
      DOTNET_INSTALL_DIR: ${{ vars.WINDOWS_RUNNER && format('{0}/.dotnet', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Vela.sln
      # Warnings fail the build (#448): the solution builds warning-free, so a new compiler, analyzer or xUnit warning
      # is fixed in the PR that introduces it. NuGet audit advisories (NU1901-NU1904) stay warnings: a new advisory on
      # a pinned package should not turn every open PR red; it still shows in the build log.
      - name: Build
        run: dotnet build Vela.sln -c Release --no-restore -p:TreatWarningsAsErrors=true -p:WarningsNotAsErrors="NU1901%3BNU1902%3BNU1903%3BNU1904"
      # StepApi.cs / StepBuilder.Impl.cs are generated from tools/codegen/Vela.StepApiGen/MessageModel.cs. Fail
      # when the committed files differ from the generator output (a hand edit, or a model change not regenerated).
      - name: Generated step API is up to date
        run: dotnet run --project tools/codegen/Vela.StepApiGen -c Release --no-build -- --check
      # The only check that compiles what `vela init` generates: scaffold a solution, pack the repo's
      # Vela.Plugins / Vela.Testing / Vela.Messages into a local feed, then restore + build it. Opt-in locally
      # (skipped without VELA_BUILD_SMOKE=1), always on in CI. The packs are version 1.0.0, and a 1.0.0 left in the
      # global NuGet cache would shadow the fresh local feed, so evict it first (a no-op on a fresh hosted runner; a
      # self-hosted runner's cache persists between runs).
      - name: Scaffold build smoke
        env:
          VELA_BUILD_SMOKE: '1'
          # A failed scaffold build keeps its binlog here (uploaded below), e.g. to diagnose a pack race (#406).
          VELA_SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs
        run: |
          $cache = Join-Path $env:USERPROFILE '.nuget\packages'
          foreach ($p in 'vela.plugins', 'vela.testing', 'vela.messages') {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $cache "$p\1.0.0")
          }
          dotnet test tests/Vela.Cli.Tests/Vela.Cli.Tests.csproj -c Release --no-build `
            --filter "FullyQualifiedName~ProjectScaffolderTests.Generate_ThenDotnetBuild_Succeeds"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload scaffold build binlog
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scaffold-build-binlog
          path: smoke-logs/
          if-no-files-found: ignore

      # Each test project runs ONCE, with coverage collection on that same run (A-80: CI used to run the suite up to
      # seven times: a plain `dotnet test Vela.sln`, then each gated project again for its coverage). The gates are on
      # branch coverage (not line coverage). Thresholds sit just below measured coverage so they catch regressions
      # without churn; raise them as coverage improves. Every test project must reference coverlet.msbuild, or its
      # threshold is silently ignored, and must be listed here: the guard below fails when one is not. A test project
      # is any project of the solution that references Microsoft.NET.Test.Sdk, wherever it lives (tests/, docs/samples/).
      - name: Every test project is run below
        run: |
          $listed = 'Vela.Tests', 'Vela.Testing.Tests', 'Vela.Cli.Tests', 'Vela.Analyzers.Tests', 'Vela.CodeFixes.Tests', 'Vela.DocSamples'
          $found = dotnet sln Vela.sln list | Where-Object { $_ -like '*.csproj' } |
            Where-Object { (Get-Content $_ -Raw) -match 'Microsoft\.NET\.Test\.Sdk' } |
            ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) }
          $missing = $found | Where-Object { $listed -notcontains $_ }
          if ($missing) { Write-Error "Test project(s) not run by CI: $($missing -join ', ')"; exit 1 }
          Write-Host "Test projects: $($found -join ', ')"
      # The documentation samples (docs/samples): their tests keep the snippets the pages include working. No gate.
      - name: Test - documentation samples
        if: ${{ !cancelled() }} # run every project even when an earlier gate failed
        run: dotnet test docs/samples/Vela.DocSamples/Vela.DocSamples.csproj -c Release --no-build
      - name: Test + coverage gate (branch) - diff engine
        if: ${{ !cancelled() }} # run every project even when an earlier gate failed
        run: >
          dotnet test tests/Vela.Cli.Tests/Vela.Cli.Tests.csproj -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=90
          -p:Include="[Vela.Cli]Vela.Cli.DiffEngine%2c[Vela.Cli]Vela.Cli.DefinitionNormalizer"
      - name: Test + coverage gate (branch) - analyzers
        if: ${{ !cancelled() }} # run every project even when an earlier gate failed
        run: >
          dotnet test tests/Vela.Analyzers.Tests/Vela.Analyzers.Tests.csproj -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=80
          -p:Include="[Vela.Analyzers]*"
      - name: Test + coverage gate (branch) - code fixes
        if: ${{ !cancelled() }} # run every project even when an earlier gate failed
        run: >
          dotnet test tests/Vela.CodeFixes.Tests/Vela.CodeFixes.Tests.csproj -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:ThresholdType=branch -p:ThresholdStat=total -p:Threshold=82
          -p:Include="[Vela.CodeFixes]*"

      # Vela.Plugins (the plugin runtime) is exercised by BOTH Vela.Tests and Vela.Testing.Tests, so its coverage is the
      # merge of the two: the Vela.Tests run collects the runtime to JSON, and the Vela.Testing.Tests run (which also
      # collects the harness) merges over it. A coverlet threshold is one number for every module, so the gate below
      # reads each module's branch-rate from the merged Cobertura report instead (the same figure coverlet prints).
      - name: Test + coverage (collect) - plugin runtime
        if: ${{ !cancelled() }} # run every project even when an earlier gate failed
        run: >
          dotnet test tests/Vela.Tests/Vela.Tests.csproj -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=json
          -p:Include="[Vela.Plugins]*" -p:CoverletOutput=./plugins-coverage.json
      - name: Test + coverage (collect) - test harness, merged with the plugin runtime
        if: ${{ !cancelled() }} # run every project even when an earlier gate failed
        run: >
          dotnet test tests/Vela.Testing.Tests/Vela.Testing.Tests.csproj -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:MergeWith="${{ github.workspace }}/tests/Vela.Tests/plugins-coverage.json"
          -p:Include="[Vela.Testing]*%2c[Vela.Plugins]*" -p:CoverletOutput=./merged-coverage.xml
      - name: Coverage gate (branch) - test harness and plugin runtime
        if: ${{ !cancelled() }} # run every project even when an earlier gate failed
        run: |
          [xml]$report = Get-Content tests/Vela.Testing.Tests/merged-coverage.xml
          $gates = [ordered]@{ 'Vela.Testing' = 87; 'Vela.Plugins' = 83 }
          $failed = $false
          foreach ($module in $gates.Keys) {
            $package = $report.coverage.packages.package | Where-Object { $_.name -eq $module }
            if (-not $package) { Write-Error "No coverage collected for $module"; $failed = $true; continue }
            $branch = [math]::Round([double]::Parse($package.'branch-rate', [Globalization.CultureInfo]::InvariantCulture) * 100, 2)
            Write-Host "$module branch coverage: $branch% (threshold $($gates[$module])%)"
            if ($branch -lt $gates[$module]) { Write-Error "$module branch coverage $branch% is below $($gates[$module])%"; $failed = $true }
          }
          if ($failed) { exit 1 }
