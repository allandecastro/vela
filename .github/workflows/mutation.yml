  cli-apply:
    runs-on: windows-latest
    timeout-minutes: 60 # apply reconciliation is a large net10 surface
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install x64 .NET runtime for the VsTest test host
        # The runner is arm64 but Stryker's VsTest spawns an x64 test host; install the x64 runtime.
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\dotnet-x64"
          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # The apply reconciliation core (DataverseRegistration.Apply): package/assembly/type sync, the resume report,
      # the stale-assembly-version guard, and the ApplyDiff step/Custom-API orchestration (create/update/delete +
      # the ignorable-stage-fault skip), all driven through the IOrganizationService seam. net10-only, so no
      # --solution. The web-resource branches (a work-in-progress preview) are excluded with Stryker comments.
      # Measured at ~80.3% after covering the package publish/compare paths, the deterministic repack, the
      # solution-scoped package import and the assembly update rules; --break-at is held at the 80 floor.
      # The remaining survivors are equivalent (log-arg/culture/version fallbacks, polling-loop timing bounds,
      # temp-dir path strings, columnsets the fake ignores).
      - name: Mutation test - CLI apply reconciliation
        working-directory: tests/Vela.Cli.Tests
        run: >
          dotnet-stryker
          --project Vela.Cli.csproj
          --mutate "**/DataverseRegistration.Apply.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 80 --threshold-low 80 --threshold-high 88
      - name: List surviving mutants (apply)
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
