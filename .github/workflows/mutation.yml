          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # The plan reader (DataverseRegistration.cs): reads plugin assemblies/types, steps (+ message/filter links,
      # images, secure config) and Custom APIs (+ request/response parameters) out of Dataverse and maps them to the
      # diff shape. Driven through the IOrganizationService seam. Measured at ~85.3%; --break-at is ratcheted to 83.
      # The live-connection methods (CreateDataverseClient*, BuildDataverseState) carry a `// Stryker disable all`
