                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        shell: powershell
        run: >
          Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-cli-reader
          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  cli-steps:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install x64 .NET runtime for the VsTest test host
        # The runner is arm64 but Stryker's VsTest spawns an x64 test host; install the x64 runtime.
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\dotnet-x64"
          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker
      # The step reconciliation core (DataverseRegistration.Steps): the step entity build, step lookup by key or
      # (message, entity, stage, mode) signature, message/filter id resolution, secure-config + state reconcile,
      # image reconcile (create/update/delete + Create-message property), and the stage/rank/name normalizers.
      # Driven through the IOrganizationService seam. Measured at ~89.4%; --break-at is ratcheted to 87. Remaining
      # survivors are equivalent (LogOperation arg strings, aliased-value reads Stryker can't attribute, ternaries
      # whose branches match on the tested inputs).
      - name: Mutation test — CLI step reconciliation
        working-directory: tests/Vela.Cli.Tests
        run: >
          dotnet-stryker
          --mutate "**/DataverseRegistration.Steps.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 87 --threshold-low 87 --threshold-high 94
      - name: List surviving mutants (steps)
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        shell: powershell
        run: >
          Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-cli-steps
          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  cli-scanner:
    runs-on: [self-hosted, Windows, X64]
