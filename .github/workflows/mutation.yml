                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        run: >
          Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-security-cli
          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  security-enforcement:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker
      # The security ENFORCEMENT wiring (DemandAccess/CanAccess, cascade delete/assign/share, FLS masking + write
      # rejection, inherited access, share clamping, owner-BU realign, the read filter and the membership tables) is
      # isolated in the InMemoryOrganizationService.Security.cs partial, so the gate measures only that surface — not
      # the store's query/versioning/seed code. Measured at ~84.8% after killing the real survivors (FLS aggregate/
      # group-by, cascade owner/scope/recursion, cascade share/unshare recursion+scope); --break-at is ratcheted to 82
      # (~2pts below). Remaining survivors are mostly equivalent — guard-clause early returns whose downstream also
      # guards, fault-message / entity-name strings, and owner-column removals the system field applier re-derives; the
      # "List surviving mutants" step dumps them for future triage.
      - name: Mutation test — enforcement wiring (InMemoryOrganizationService.Security)
        working-directory: tests/Vela.Testing.Tests
        run: >
          dotnet-stryker
          --solution ../../Vela.sln
          --mutate "**/Fakes/InMemoryOrganizationService.Security.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 82 --threshold-low 82 --threshold-high 90
      - name: List surviving mutants
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Testing.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        shell: powershell
        run: >
          Get-ChildItem tests/Vela.Testing.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-security-enforcement
          path: tests/Vela.Testing.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  cli-cores:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60 # apply/reader/scanner are a large net10 surface; measure-first
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install x64 .NET runtime for the VsTest test host
        # The runner is arm64 but Stryker's VsTest spawns an x64 test host; install the x64 runtime.
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\dotnet-x64"
          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker
      # The CLI plan/apply cores: the DataverseRegistration reconciliation (reading registrations + applying plugin
      # steps and Custom APIs) and the plugin-package scanner. net10-only, so no --solution. --break-at 0 measures
      # first; the "List surviving mutants" step below dumps survivors so the real ones can be killed, then the gate
      # is ratcheted from 0.
      - name: Mutation test — CLI plan/apply cores
        working-directory: tests/Vela.Cli.Tests
        run: >
          dotnet-stryker
          --mutate "**/DataverseRegistration.cs" --mutate "**/DataverseRegistration.Apply.cs"
          --mutate "**/DataverseRegistration.Steps.cs" --mutate "**/DataverseRegistration.CustomApi.cs"
          --mutate "**/PackageScanner.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 0 --threshold-low 70 --threshold-high 85
      - name: List surviving mutants
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
