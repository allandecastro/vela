name: Mutation Testing

# Mutation testing (Stryker.NET) of the correctness cores, split into areas. tests/stryker/areas.json lists them
# (the test project each runs from, its timeout, the source paths it covers), and tests/stryker/<area>.yml holds each
# area's Stryker configuration: the files it mutates, its thresholds and why they sit where they do. See
# docs/advanced/mutation-testing.md.
#
# - Weekly and on demand: every area, on all of its files, gated by the area's `break` threshold. A manual run can
#   name the areas to run (the `areas` input, e.g. `gh workflow run mutation.yml -f areas=analyzers`).
# - On a pull request: only the areas whose files the PR changes (every area when it changes the shared setup:
#   areas.json, select-areas.ps1, this workflow or .config/dotnet-tools.json), and only the mutants of the changed
#   files (`--since:main`), gated at the 80 floor. An incremental run scores a handful of mutants, so it is gated at the
#   floor rather than at the area's ratcheted threshold.
#
# Stryker is pinned in .config/dotnet-tools.json (`dotnet tool restore`), so a Stryker release cannot move the scores
# on its own. Every job runs on a GitHub-hosted Windows runner, like ci.yml: the net462 projects only build on
# Windows. Each area is its own job, so the areas run in parallel.
on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas to run, comma-separated (e.g. analyzers,plugins-steps); empty runs every area'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  pull_request:
    paths:
      - 'src/**'
      - 'tests/stryker/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/mutation.yml'

# A newer push to the same PR cancels its running mutation jobs; scheduled and manual runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository. A pull request from a fork runs with a read-only token and no
# secrets (the `pull_request` event, never `pull_request_target`).
permissions:
  contents: read

# Windows PowerShell 5.1 is always present on the Windows runner; it is the default shell for run steps.
defaults:
  run:
    shell: powershell

jobs:
  # Picks the areas to run: all of them, or on a pull request those whose files it changes.
  plan:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.select.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Select areas
        id: select
        env:
          # Passed through the environment, never interpolated into the script.
          ONLY_AREAS: ${{ github.event.inputs.areas }}
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $changed = Join-Path $env:RUNNER_TEMP 'changed.txt'
            # -Value, not a pipeline: an empty diff (the PR already merged when the run starts) still writes the file.
            Set-Content -Path $changed -Value @(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            $areas = & ./tests/stryker/select-areas.ps1 -ChangedFiles $changed
          } elseif ($env:ONLY_AREAS) {
            $areas = & ./tests/stryker/select-areas.ps1 -Only $env:ONLY_AREAS
          } else {
            $areas = & ./tests/stryker/select-areas.ps1
          }
          "areas=$areas" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Areas: $areas"

  mutation:
    name: ${{ matrix.area }}
    needs: plan
    if: needs.plan.outputs.areas != '[]'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.areas) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # --since:main diffs against main, so a pull request run needs the history back to it.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Make the base branch available as main
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/heads/main"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker (pinned in .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Mutation test - ${{ matrix.area }}
        if: github.event_name != 'pull_request'
        working-directory: ${{ matrix.tests }}
        run: dotnet tool run dotnet-stryker --config-file ../stryker/${{ matrix.area }}.yml
      - name: Mutation test - ${{ matrix.area }} (changed files only)
        if: github.event_name == 'pull_request'
        working-directory: ${{ matrix.tests }}
        run: dotnet tool run dotnet-stryker --config-file ../stryker/${{ matrix.area }}.yml --since:main --break-at 80

      # Dumps every survivor so the next round can keep killing rather than lowering the gate. The newest report is
      # read, in case a workspace holds more than one.
      - name: List surviving mutants
        if: always()
        run: |
          $f = Get-ChildItem ${{ matrix.tests }}/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        run: >
          Get-ChildItem ${{ matrix.tests }}/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true # artifact storage quota must not fail the mutation gate; the report is also in the summary
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.area }}
          path: ${{ matrix.tests }}/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore
