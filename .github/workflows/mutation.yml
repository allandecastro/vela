name: Mutation Testing

# Mutation testing (Stryker.NET) is much slower than the unit suite, so it does NOT run on every PR: it runs
# weekly and on demand. Each job mutates a correctness core and publishes the rendered report to the run summary
# plus an HTML artifact.
#
# Jobs run on GitHub-hosted windows-latest runners (reliable for long runs, unlike the personal self-hosted box
# that can sleep or drop its connection mid-run). The harness (net462) needs Windows, and Stryker's VsTest
# launches an x64 test host, which windows-latest (x64) provides. The diff-engine's explicit x64-runtime install
# below is a leftover from the arm64 self-hosted runner; harmless on x64.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC

# Use Windows PowerShell 5.1 (always present) rather than pwsh: the runner's pwsh is the WindowsApps stub,
# which the service account can't execute ("EACCES ... pwsh.EXE"), intermittently failing steps.
defaults:
  run:
    shell: powershell

env:
  # Stryker is pinned: 5.0.0 (picked up on 2026-09-14 by an unpinned `tool update`) fails to compile the net462
  # projects (CS0234 "Xrm does not exist in the namespace Microsoft" on Vela.Testing), so every harness job scored
  # 0% from then on. Bump deliberately, after a green workflow_dispatch run on a branch.
  STRYKER_VERSION: 4.16.0

jobs:
  diff-engine:
    runs-on: windows-latest
    timeout-minutes: 30 # a normal run is ~12min; cap a hung restore/build (the runner is a personal machine that can sleep)
    env:
      # The runner's account can't write to C:\Program Files\dotnet, so install .NET into a writable dir.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install x64 .NET runtime for the VsTest test host
        # The runner is arm64 but Stryker's VsTest spawns an x64 test host; install the x64 runtime so it can start
        # and expose it via DOTNET_ROOT_X64 (the arch-specific lookup the x64 apphost uses).
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\dotnet-x64"
          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # net10-only project: no --solution, so Stryker builds just the CLI test project (+ its referenced Vela.Cli)
      # and never drags the net462 projects into the build. --project disambiguates the mutation target: the CLI test
      # project also references the compiled plugin fixtures (Sample/BrokenPluginFixture), so Stryker can't auto-pick.
      - name: Mutation test - diff engine + normalizer
        working-directory: tests/Vela.Cli.Tests
        run: >
          dotnet-stryker
          --project Vela.Cli.csproj
          --mutate "**/DiffEngine.cs" --mutate "**/DefinitionNormalizer.cs"
          --reporter cleartext --reporter markdown --reporter html
          --break-at 85 --threshold-low 85 --threshold-high 90
      - name: Publish report to job summary
        if: always()
        run: >
          Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true # artifact storage quota must not fail the mutation gate; the report is also in the summary
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-diff-engine
          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  harness:
    runs-on: windows-latest
    timeout-minutes: 45 # the 2026-10 run with Stryker 4.16.0 hit the old 30-minute cap; still caps a hung restore/build
    env:
      # The runner's account can't write to C:\Program Files\dotnet, so install .NET into a writable dir.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker
        # Idempotent: the self-hosted runner persists the global tool between runs, so a plain
        # `tool install` would fail on the second run once it is already present.
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # The harness query core (operators, value comparison, FetchXML parsing). --solution lets Stryker build the
      # net462 projects through the solution. Measured at ~91.6% after killing the behavioural survivors (NotBetween
      # upper-bound inclusivity, FetchXML named-attribute projection, …); --break-at is ratcheted to 89 (~2pts below).
      # The remaining survivors are equivalent mutants (exception-message strings, never-null/never-empty edges); the
      # "List surviving mutants" step dumps them so the next round can keep killing rather than lowering the gate.
      - name: Mutation test - in-memory harness query core
        working-directory: tests/Vela.Testing.Tests
        run: >
          dotnet-stryker
          --solution ../../Vela.sln
          --mutate "**/InMemoryQueryEngine.cs" --mutate "**/FetchXmlParser.cs" --mutate "**/EntityValues.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 89 --threshold-low 89 --threshold-high 95
      - name: List surviving mutants
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Testing.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        run: >
          Get-ChildItem tests/Vela.Testing.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true # artifact storage quota must not fail the mutation gate; the report is also in the summary
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-harness
          path: tests/Vela.Testing.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  security-harness:
    runs-on: windows-latest
    timeout-minutes: 45 # more files than the query-core job
    env:
      # The runner's account can't write to C:\Program Files\dotnet, so install .NET into a writable dir.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # The opt-in security model's decision logic (roles/privileges/depth/sharing/access-teams/hierarchy/FLS,
      # 1:N cascade config). Measured at ~86.2% after killing the real survivors; --break-at is ratcheted to 84
      # (~2pts below), the remaining survivors being equivalents (exception-message strings, comparer internals,
      # cycle guards). The enforcement wiring in InMemoryOrganizationService is a whole-file surface, left for a
      # separate pass. The "List surviving mutants" step dumps what remains.
      - name: Mutation test - harness security model
        working-directory: tests/Vela.Testing.Tests
        run: >
          dotnet-stryker
          --solution ../../Vela.sln
          --mutate "**/Security/SecurityModel.cs" --mutate "**/Security/SharingTable.cs"
          --mutate "**/Security/AccessTeamGrants.cs" --mutate "**/Fakes/OneToManyRegistry.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 84 --threshold-low 84 --threshold-high 90
      - name: List surviving mutants
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Testing.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
