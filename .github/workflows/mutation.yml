    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install x64 .NET runtime for the VsTest test host
        # The runner is arm64 but Stryker's VsTest spawns an x64 test host; install the x64 runtime.
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\dotnet-x64"
          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker
      # The Custom API reconciliation core (DataverseRegistration.CustomApi): the customapi entity build, request/
      # response parameter reconciliation (create/update/delete-orphan), the uniquename lookup, and the parameter
      # type-code resolver — all driven through the IOrganizationService seam. Measured at ~82.7%; --break-at is
      # ratcheted to 80. Remaining survivors are equivalent (LogOperation arg strings, the static ParameterSyncSpec
      # record literals, and read-only ColumnSet columns).
      - name: Mutation test — CLI Custom API reconciliation
        working-directory: tests/Vela.Cli.Tests
        run: >
          dotnet-stryker
          --mutate "**/DataverseRegistration.CustomApi.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
