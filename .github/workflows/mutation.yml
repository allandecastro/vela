name: Mutation Testing

# Mutation testing (Stryker.NET) of the correctness cores, split into areas. tests/stryker/areas.json lists them
# (the test project each runs from, its timeout, the source paths it covers), and tests/stryker/<area>.yml holds each
# area's Stryker configuration: the files it mutates, its thresholds and why they sit where they do. See
# docs/advanced/mutation-testing.md.
#
# - Weekly and on demand: every area, on all of its files, gated by the area's `break` threshold.
# - On a pull request: only the areas whose files the PR changes, and only the mutants of the changed files
#   (`--since:main`), gated at the 80 floor. An incremental run scores a handful of mutants, so it is gated at the
#   floor rather than at the area's ratcheted threshold.
#
# Stryker is pinned in .config/dotnet-tools.json (`dotnet tool restore`), so a Stryker release cannot move the scores
# on its own. The mutation jobs run on GitHub-hosted windows-latest runners (reliable for long runs, unlike the
# personal self-hosted box that can sleep mid-run): the net462 projects only build on Windows, and Stryker's VsTest
# launches an x64 test host, which windows-latest (x64) provides.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  pull_request:
    paths:
      - 'src/**'
      - 'tests/stryker/**'

# A newer push to the same PR cancels its running mutation jobs; scheduled and manual runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Picks the areas to run: all of them, or on a pull request those whose files it changes.
  plan:
    # Pull requests from forks are skipped, like the CI workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.select.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select areas
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
            areas=$(python3 tests/stryker/select-areas.py "$RUNNER_TEMP/changed.txt")
          else
            areas=$(python3 tests/stryker/select-areas.py)
          fi
          echo "areas=$areas" >> "$GITHUB_OUTPUT"
          echo "Areas: $areas"

  mutation:
    name: ${{ matrix.area }}
    needs: plan
    if: needs.plan.outputs.areas != '[]'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.areas) }}
    # Use Windows PowerShell 5.1 (always present) rather than pwsh: the runner's pwsh is the WindowsApps stub,
    # which the service account can't execute ("EACCES ... pwsh.EXE"), intermittently failing steps.
    defaults:
      run:
        shell: powershell
    env:
      # The runner's account can't write to C:\Program Files\dotnet, so install .NET into a writable dir.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
        with:
          # --since:main diffs against main, so a pull request run needs the history back to it.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Make the base branch available as main
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/heads/main"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker (pinned in .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Mutation test - ${{ matrix.area }}
        if: github.event_name != 'pull_request'
        working-directory: ${{ matrix.tests }}
        run: dotnet tool run dotnet-stryker --config-file ../stryker/${{ matrix.area }}.yml
      - name: Mutation test - ${{ matrix.area }} (changed files only)
        if: github.event_name == 'pull_request'
        working-directory: ${{ matrix.tests }}
        run: dotnet tool run dotnet-stryker --config-file ../stryker/${{ matrix.area }}.yml --since:main --break-at 80

      # Dumps every survivor so the next round can keep killing rather than lowering the gate.
      - name: List surviving mutants
        if: always()
        run: |
          $f = Get-ChildItem ${{ matrix.tests }}/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        run: >
          Get-ChildItem ${{ matrix.tests }}/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true # artifact storage quota must not fail the mutation gate; the report is also in the summary
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.area }}
          path: ${{ matrix.tests }}/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore
