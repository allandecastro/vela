  cli-reader:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
