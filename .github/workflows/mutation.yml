          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  security-enforcement:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # The security ENFORCEMENT wiring (DemandAccess/CanAccess, cascade delete/assign/share, FLS masking + write
      # rejection, inherited access, share clamping, owner-BU realign, the read filter and the membership tables) is
      # isolated in the InMemoryOrganizationService.Security.cs partial, so the gate measures only that surface - not
      # the store's query/versioning/seed code. Measured at ~84.8% after killing the real survivors (FLS aggregate/
      # group-by, cascade owner/scope/recursion, cascade share/unshare recursion+scope); --break-at is ratcheted to 82
      # (~2pts below). Remaining survivors are mostly equivalent - guard-clause early returns whose downstream also
      # guards, fault-message / entity-name strings, and owner-column removals the system field applier re-derives; the
      # "List surviving mutants" step dumps them for future triage.
      - name: Mutation test - enforcement wiring (InMemoryOrganizationService.Security)
        working-directory: tests/Vela.Testing.Tests
        run: >
          dotnet-stryker
          --solution ../../Vela.sln
          --mutate "**/Fakes/InMemoryOrganizationService.Security.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
