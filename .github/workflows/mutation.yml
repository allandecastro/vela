          --mutate "**/DataverseRegistration.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 83 --threshold-low 83 --threshold-high 92
      - name: List surviving mutants (reader)
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        shell: powershell
        run: >
          Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-cli-reader
          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  cli-steps:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install x64 .NET runtime for the VsTest test host
        # The runner is arm64 but Stryker's VsTest spawns an x64 test host; install the x64 runtime.
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\dotnet-x64"
          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # The step reconciliation core (DataverseRegistration.Steps): the step entity build, step lookup by key or
      # (message, entity, stage, mode) signature, message/filter id resolution, secure-config + state reconcile,
      # image reconcile (create/update/delete + Create-message property), and the stage/rank/name normalizers.
      # Driven through the IOrganizationService seam. Measured at ~89.4%; --break-at is ratcheted to 87. Remaining
      # survivors are equivalent (LogOperation arg strings, aliased-value reads Stryker can't attribute, ternaries
      # whose branches match on the tested inputs).
      - name: Mutation test - CLI step reconciliation
        working-directory: tests/Vela.Cli.Tests
        run: >
          dotnet-stryker
          --project Vela.Cli.csproj
          --mutate "**/DataverseRegistration.Steps.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 87 --threshold-low 87 --threshold-high 94
      - name: List surviving mutants (steps)
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        shell: powershell
        run: >
          Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-cli-steps
          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  cli-scanner:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install x64 .NET runtime for the VsTest test host
        # The runner is arm64 but Stryker's VsTest spawns an x64 test host; install the x64 runtime.
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\dotnet-x64"
          & ([scriptblock]::Create((Invoke-RestMethod https://dot.net/v1/dotnet-install.ps1))) -Channel 10.0 -Runtime dotnet -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # The package scanner (PackageScanner.cs): extracts plugin .nupkg packages (lib/*.dll selection, primary
      # pick, registrable filtering), reads nuspec id/version, and reflects over plugin/Custom-API types to read
      # their definitions. Driven with crafted .nupkg fixtures + stub plugin types, plus PackageScannerBuildStateTests
      # which runs BuildLocalStateFromPackages end-to-end on a real compiled plugin fixture (Sample/BrokenPluginFixture),
      # so the former `// Stryker disable all` block is gone. Measured at ~81.6%; --break-at is ratcheted to 80.
      - name: Mutation test - CLI package scanner
        working-directory: tests/Vela.Cli.Tests
        run: >
          dotnet-stryker
          --project Vela.Cli.csproj
          --mutate "**/PackageScanner.cs"
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at 80 --threshold-low 80 --threshold-high 90
      - name: List surviving mutants (scanner)
        if: always()
        shell: powershell
        run: |
          $f = Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        shell: powershell
        run: >
          Get-ChildItem tests/Vela.Cli.Tests/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-cli-scanner
          path: tests/Vela.Cli.Tests/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore

  # The runtime (Vela.Plugins, mutated through the Vela.Tests suite) and the harness store and pipeline (Vela.Testing,
  # mutated through Vela.Testing.Tests), #448. Before these jobs, the runtime had no mutation gate at all, so a
  # behaviour every test merely executed could change unnoticed. One matrix entry per core; the gates start at the
  # 80% policy floor and are ratcheted to ~2pts under the measured score, like the jobs above.
  runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime-plugin
            tests: tests/Vela.Tests
            project: Vela.Plugins.csproj
            mutate: '--mutate "**/Plugin/PluginBase.cs" --mutate "**/Plugin/PluginBaseOfTEntity.cs" --mutate "**/Plugin/HandlerInvoker.cs"'
            break: 80
          - name: runtime-context
            tests: tests/Vela.Tests
            project: Vela.Plugins.csproj
            mutate: '--mutate "**/Context/LocalPluginContext.cs" --mutate "**/Context/TracingOrganizationService.cs"'
            break: 80
          - name: runtime-services
            tests: tests/Vela.Tests
            project: Vela.Plugins.csproj
            mutate: '--mutate "**/Retry/RetryPolicy.cs" --mutate "**/Caching/PluginCacheService.cs"'
            break: 80
          - name: harness-store
            tests: tests/Vela.Testing.Tests
            project: Vela.Testing.csproj
            mutate: '--mutate "**/Fakes/InMemoryOrganizationService.cs"'
            break: 80
          - name: harness-pipeline
            tests: tests/Vela.Testing.Tests
            project: Vela.Testing.csproj
            mutate: '--mutate "**/Pipeline/PluginPipeline.cs" --mutate "**/Pipeline/PluginPipeline.Stages.cs" --mutate "**/Pipeline/PluginPipeline.Execution.cs"'
            break: 80
    name: ${{ matrix.name }}
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker
        run: dotnet tool update -g dotnet-stryker --version $env:STRYKER_VERSION --allow-downgrade
      # --solution builds the net462 projects through the solution; --project names the mutated assembly, since each
      # test project references more than one of ours.
      - name: Mutation test - ${{ matrix.name }}
        working-directory: ${{ matrix.tests }}
        run: >
          dotnet-stryker
          --solution ../../Vela.sln
          --project ${{ matrix.project }}
          ${{ matrix.mutate }}
          --reporter cleartext --reporter markdown --reporter html --reporter json
          --break-at ${{ matrix.break }} --threshold-low ${{ matrix.break }} --threshold-high 90
      - name: List surviving mutants
        if: always()
        run: |
          $f = Get-ChildItem ${{ matrix.tests }}/StrykerOutput/*/reports/mutation-report.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host 'no json report'; exit 0 }
          $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
          $n = 0
          foreach ($p in $j.files.PSObject.Properties) {
            $short = Split-Path $p.Name -Leaf
            foreach ($m in $p.Value.mutants) {
              if ($m.status -eq 'Survived' -or $m.status -eq 'NoCoverage') {
                $n++
                $repl = ($m.replacement -replace '\s+', ' ')
                if ($repl.Length -gt 70) { $repl = $repl.Substring(0, 70) }
                'SURV|{0}|{1}|L{2}|{3}|{4}' -f $short, $m.status, $m.location.start.line, $m.mutatorName, $repl
              }
            }
          }
          Write-Host "TOTAL survivors/no-coverage: $n"
      - name: Publish report to job summary
        if: always()
        run: >
          Get-ChildItem ${{ matrix.tests }}/StrykerOutput/*/reports/mutation-report.md -ErrorAction SilentlyContinue
          | Get-Content | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.name }}
          path: ${{ matrix.tests }}/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore
