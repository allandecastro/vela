name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # A pull request builds the site (warnings are errors) without deploying it, so a broken link, anchor or
  # snippet include fails the PR instead of the deployment. The snippets themselves (docs/samples) compile and run
  # in the main CI, as part of Vela.sln.
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege: read-only by default; only the deployment job gets the Pages permissions.
permissions:
  contents: read

# Only one Pages deployment at a time; a newer push cancels an in-flight build. A pull request has its own group,
# so it never cancels a deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  check:
    # Every pull request, forks included (GitHub-hosted runner, read-only token, no secrets).
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install DocFX
        run: dotnet tool update -g docfx
      - name: Build the docs site
        run: docfx docs/docfx.json --warningsAsErrors

  build-deploy:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write # deploy-pages publishes the site
      id-token: write # deploy-pages authenticates with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install DocFX
        run: dotnet tool update -g docfx
      - name: Build the docs site
        run: docfx docs/docfx.json --warningsAsErrors
      # llms.txt (copied as a resource) indexes the pages by their Markdown URL on this site rather than on
      # raw.githubusercontent.com (which returned 404 while the repository was private). Each listed page is
      # published next to its .html, and llms-full.txt is every page it lists, concatenated in that order, for
      # tools that read the whole documentation in one request.
      - name: Publish the llms.txt pages and write llms-full.txt
        shell: powershell
        run: |
          $pages = Select-String -Path docs\llms.txt -Pattern 'allandecastro\.github\.io/vela/([^)]+\.md)\)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Where-Object { $_ -ne 'CHANGELOG.md' }
          if (-not $pages) { throw 'docs/llms.txt lists no page' }
          # The copies inline the docfx code includes, so a reader of the Markdown sees the sample code.
          foreach ($page in $pages) {
            & docs\tools\Expand-CodeIncludes.ps1 -Page (Join-Path docs $page) -Destination (Join-Path docs\_site $page)
          }
          Copy-Item CHANGELOG.md docs\_site\CHANGELOG.md
          $out = foreach ($page in $pages) { "<!-- $page -->"; Get-Content -Raw -Encoding UTF8 (Join-Path docs\_site $page); '' }
          Set-Content -Path docs\_site\llms-full.txt -Value $out -Encoding UTF8
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Build the Pages artifact (a `github-pages` artifact containing `artifact.tar`) ourselves with the
      # native Windows tar.exe rather than actions/upload-pages-artifact, then let deploy-pages consume it.
      - name: Archive the Pages artifact (Windows tar)
        shell: powershell
        run: |
          New-Item -ItemType File -Path docs\_site\.nojekyll -Force | Out-Null
          tar --directory docs\_site -cvf "$env:RUNNER_TEMP\artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
