name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push cancels an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: [self-hosted, Windows]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install DocFX
        run: dotnet tool update -g docfx
      - name: Build the docs site
        run: docfx docs/docfx.json --warningsAsErrors
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Build the Pages artifact (a `github-pages` artifact containing `artifact.tar`) ourselves with the
      # native Windows tar.exe rather than actions/upload-pages-artifact, then let deploy-pages consume it.
      - name: Archive the Pages artifact (Windows tar)
        shell: powershell
        run: |
          New-Item -ItemType File -Path docs\_site\.nojekyll -Force | Out-Null
          tar --directory docs\_site -cvf "$env:RUNNER_TEMP\artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
