name: release

on:
  push:
    tags:
      - "v*"

jobs:
  pack-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Vela.sln

      - name: Build
        run: dotnet build Vela.sln -c Release --no-restore

      - name: Test
        run: dotnet test Vela.sln -c Release --no-build

      - name: Pack plugins
        run: dotnet pack .\src\Vela.Plugins\Vela.Plugins.csproj -c Release -o .\artifacts\plugins --no-build

      - name: Pack cli
        run: dotnet pack .\src\Vela.Cli\Vela.Cli.csproj -c Release -o .\artifacts\cli --no-build

      - name: Pack testing
        run: dotnet pack .\src\Vela.Testing\Vela.Testing.csproj -c Release -o .\artifacts\testing --no-build

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vela-release
          path: artifacts\**

      - name: Create GitHub Release with packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts -Recurse -Filter *.nupkg | ForEach-Object FullName) --title "${{ github.ref_name }}" --generate-notes
        shell: pwsh
