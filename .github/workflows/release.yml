name: Release & Publish to NuGet

on:
  push:
    tags:
      # Two independent release lines:
      #   framework-vX.Y.Z -> Vela.Plugins + Vela.Testing (the framework libs, version-locked together)
      #   cli-vX.Y.Z       -> Vela.Cli (the global tool, released at its own cadence)
      - "framework-v*"
      - "cli-v*"

permissions:
  # id-token: OIDC token exchange for NuGet Trusted Publishing (no long-lived API key).
  # contents: gh release create needs write access to publish the GitHub Release.
  id-token: write
  contents: write

jobs:
  pack-and-publish:
    # Self-hosted Windows runner: net462 (the harness) only builds on Windows, so packing must run there.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30 # cap a hung restore/build/publish on the self-hosted (personal) machine
    env:
      # The service account can't write to the default install root 'C:\Program Files\dotnet', so setup-dotnet
      # installs into the workspace instead (it adds this to PATH for the run steps). Same as ci.yml.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release line and version from tag
        # "framework-v1.2.0" -> LINE=framework, VERSION=1.2.0 ; "cli-v1.3.0" -> LINE=cli, VERSION=1.3.0.
        # The tag is the single source of truth; the <Version> in each .csproj is only the local-dev default.
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -like 'framework-v*') { $line = 'framework'; $version = $tag -replace '^framework-v', '' }
          elseif ($tag -like 'cli-v*')    { $line = 'cli';       $version = $tag -replace '^cli-v', '' }
          else { Write-Error "Unrecognized release tag: $tag"; exit 1 }
          echo "LINE=$line" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Vela.sln

      - name: Build
        run: dotnet build Vela.sln -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test Vela.sln -c Release --no-build

      - name: Pack framework (Vela.Plugins + Vela.Testing)
        # Both at the same version: Vela.Testing reuses Vela.Plugins internals (InternalsVisibleTo +
        # the shared AttributeValueComparer), so they must ship locked together. Packing them in one
        # invocation emits Testing's dependency on Vela.Plugins at this exact version.
        if: env.LINE == 'framework'
        shell: pwsh
        run: |
          dotnet pack .\src\Vela.Plugins\Vela.Plugins.csproj -c Release -o .\artifacts --no-build -p:Version=${{ env.VERSION }}
          dotnet pack .\src\Vela.Testing\Vela.Testing.csproj -c Release -o .\artifacts --no-build -p:Version=${{ env.VERSION }}

      - name: Pack cli (Vela.Cli)
        if: env.LINE == 'cli'
        run: dotnet pack .\src\Vela.Cli\Vela.Cli.csproj -c Release -o .\artifacts --no-build -p:Version=${{ env.VERSION }}

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vela-${{ env.LINE }}-${{ env.VERSION }}
          path: artifacts\**

      - name: Authenticate to NuGet.org (Trusted Publishing)
        # OIDC token exchange -> short-lived API key. No stored secret. Requires a Trusted Publishing policy
        # on nuget.org bound to this repo + workflow. 'user' must match the policy's package-owner account.
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: AllanDeCastro

      - name: Push to NuGet.org
        # Pushes every .nupkg and its matching .snupkg symbol package, using the temporary key from the
        # login step. --skip-duplicate keeps a re-run of the same tag idempotent.
        shell: pwsh
        run: dotnet nuget push "artifacts\**\*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release with packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts -Recurse -Filter *.nupkg | ForEach-Object FullName) --title "${{ github.ref_name }}" --generate-notes
        shell: pwsh
