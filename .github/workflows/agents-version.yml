name: AI layer version

# The "AI layer" docs section is vela-agentic's docs/ folder at the tag pinned in docs/ai-layer.version (see
# CONTRIBUTING.md#documentation). Every day, this compares that pin with vela-agentic's latest release and, when a
# newer one exists, bumps it end to end (docs/tools/Update-AgentsPin.ps1):
# - it fetches the pages, checks the tags they cite, regenerates llms.txt, writes the CHANGELOG entry and builds the
#   site with --warningsAsErrors: the checks docs.yml runs on a pull request;
# - it pushes the bump branch and fails with a link to open its PR. A PR opened with GITHUB_TOKEN starts no workflow
#   (GitHub's rule) and main requires its checks, so a maintainer opens it: the CI then runs on it as on any PR. The run
#   names the pages whose Mermaid diagrams changed, to look at once deployed;
# - when the pages cite another tag than the release, it opens an issue instead, to report to vela-agentic.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write # push the bump branch
  issues: write # report a pages problem

concurrency:
  group: agents-version
  cancel-in-progress: false

# Runner: GitHub-hosted ubuntu-latest unless the WINDOWS_RUNNER repository variable names another runner (as in
# changelog.yml). The scripts are Windows PowerShell 5.1-compatible, so they run under pwsh on ubuntu and under
# powershell on the Windows runner.
jobs:
  bump:
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ vars.WINDOWS_RUNNER && 'powershell' || 'pwsh' }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # As in docs.yml: on the self-hosted runner, setup-dotnet installs into the runner's tool cache.
      DOTNET_INSTALL_DIR: ${{ vars.WINDOWS_RUNNER && format('{0}/../../_tool/dotnet', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Find a newer vela-agentic release
        id: find
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'vela-agents-version' }
          $pinned = (Get-Content -Raw docs/ai-layer.version).Trim()
          # The latest release excludes drafts and pre-releases.
          $latest = (Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/allandecastro/vela-agentic/releases/latest').tag_name
          function ConvertTo-Version([string] $tag) {
            if ($tag -cnotmatch '^v(\d+\.\d+\.\d+)$') { throw "Not a vX.Y.Z tag: '$tag'." }
            [version] $Matches[1]
          }
          if ((ConvertTo-Version $latest) -le (ConvertTo-Version $pinned)) {
            Write-Host "docs/ai-layer.version ($pinned) is the latest vela-agentic release."
            exit 0
          }
          $branch = "docs/agents-$latest"
          $owner = $env:REPO.Split('/')[0]
          # ForEach-Object unrolls the array: Windows PowerShell's Invoke-RestMethod returns a JSON array as one object.
          $open = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/pulls?state=open&head=${owner}:$branch" | ForEach-Object { $_ })
          if ($open.Count -gt 0) {
            Write-Host "PR $($open[0].html_url) already bumps to $latest."
            exit 0
          }
          git ls-remote --exit-code --heads origin $branch | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::warning::Branch $branch is ready: open its PR at https://github.com/$env:REPO/compare/main...${branch}?expand=1"
            exit 0
          }
          $issues = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/issues?state=open&labels=area:%20docs&per_page=100" | ForEach-Object { $_ })
          if ($issues | Where-Object { $_.title -eq "docs: vela-agentic $latest pages cite another tag" }) {
            Write-Host "An open issue already reports the $latest pages."
            exit 0
          }
          "latest=$latest" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "pinned=$pinned" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "branch=$branch" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          # git ls-remote left $LASTEXITCODE at 2 (no such branch), which would fail the step.
          exit 0
      - uses: actions/setup-dotnet@v6
        if: steps.find.outputs.latest
        with:
          global-json-file: global.json
      - name: Bump the pin and check the pages
        id: bump
        if: steps.find.outputs.latest
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'diagrams.txt'
          $log = Join-Path $env:RUNNER_TEMP 'bump.log'
          & ./docs/tools/Update-AgentsPin.ps1 -Tag '${{ steps.find.outputs.latest }}' -DiagramReport $report *> $log
          $exit = $LASTEXITCODE
          Get-Content $log
          "failed=$(if ($exit -ne 0) { 'true' } else { 'false' })" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $changed = if (Test-Path $report) { @(Get-Content $report | Where-Object { $_ }) } else { @() }
          "diagrams=$($changed -join ', ')" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          exit 0
      - name: Report pages that cite another tag
        if: steps.find.outputs.latest && steps.bump.outputs.failed == 'true'
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'vela-agents-version' }
          $latest = '${{ steps.find.outputs.latest }}'
          $stale = @(Get-Content (Join-Path $env:RUNNER_TEMP 'bump.log') | Where-Object { $_ -match '^\s+docs/ai-layer/' })
          $body = (@(
            "vela-agentic $latest is released: https://github.com/allandecastro/vela-agentic/releases/tag/$latest",
            "",
            "Its pages cite another tag than $latest, so the pin stays at ${{ steps.find.outputs.pinned }} (docs/tools/Test-AgentsDocsTag.ps1):",
            "",
            '```text'
          ) + $stale + @(
            '```',
            "",
            "Report it to vela-agentic; the next daily run bumps to the release that fixes it."
          )) -join "`n"
          $issue = @{ title = "docs: vela-agentic $latest pages cite another tag"; body = $body; labels = @('area: docs', 'priority: medium') } | ConvertTo-Json
          $created = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri "https://api.github.com/repos/$env:REPO/issues" -Body $issue
          Write-Host "Opened $($created.html_url)"
          exit 1
      - name: Install DocFX (pinned in .config/dotnet-tools.json)
        if: steps.find.outputs.latest && steps.bump.outputs.failed == 'false'
        run: dotnet tool restore
      - name: Build the docs site
        if: steps.find.outputs.latest && steps.bump.outputs.failed == 'false'
        run: dotnet tool run docfx docs/docfx.json --warningsAsErrors
      - name: Push the bump branch
        if: steps.find.outputs.latest && steps.bump.outputs.failed == 'false'
        run: |
          $latest = '${{ steps.find.outputs.latest }}'
          $branch = '${{ steps.find.outputs.branch }}'
          $diagrams = '${{ steps.bump.outputs.diagrams }}'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          git add docs/ai-layer.version docs/llms.txt CHANGELOG.md
          git commit -m "docs: bump the AI layer section to vela-agentic $latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin $branch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($diagrams) { Write-Host "::notice::Diagrams changed ($diagrams): look at the rendered pages once deployed." }
          # Fails on purpose: the failed run is the notification that a PR is waiting to be opened.
          Write-Host "::error::vela-agentic $latest is ready on $branch (tags checked, llms.txt regenerated, docfx passes). Open its PR: https://github.com/$env:REPO/compare/main...${branch}?expand=1"
          exit 1
