name: Changelog

# A pull request that changes what users get (src/: the packages, the CLI, the analyzers; docs/: the documentation
# site; Directory.Packages.props and Directory.Build.props: the dependencies and build settings of every package;
# NUGET.md files: the package readmes) must add an entry to CHANGELOG.md, an added `- ` line inside `## [Unreleased]`,
# unless a maintainer labels it `no-changelog` (CI, tests, internal refactors, editorial docs passes, a dependency bump
# that changes nothing users get). See CONTRIBUTING.md#changelog.
#
# Adding or removing the label re-runs the check (`labeled` / `unlabeled`). It runs on `pull_request`, never
# `pull_request_target`: fork PRs get a read-only token and no secrets, and the check needs neither.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the diff needs the merge base of the PR and its base branch
      - name: CHANGELOG.md updated for shipped changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if [ "$NO_CHANGELOG" = "true" ]; then
            echo "Labelled no-changelog: no entry required."
            exit 0
          fi
          # Three dots: the changes of the PR since it branched, whatever has landed on the base branch since.
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          shipped=$(printf '%s\n' "$changed" \
            | grep -E '^(src|docs)/|^Directory\.(Packages|Build)\.props$|(^|/)NUGET\.md$' || true)
          if [ -z "$shipped" ]; then
            echo "No shipped file changed: no entry required."
            exit 0
          fi
          # The line range of `## [Unreleased]` in the PR head, up to the next `## [` heading.
          range=$(git show "$HEAD_SHA:CHANGELOG.md" 2>/dev/null | awk '
            /^## \[Unreleased\]/ { start = NR; next }
            start && /^## \[/ { print start, NR - 1; found = 1; exit }
            END { if (start && !found) print start, NR }')
          if [ -n "$range" ]; then
            from=${range% *}
            to=${range#* }
            # Count the added `- ` lines of the diff that land in that range (new-file line numbers, from the -U0
            # hunk headers).
            added=$(git diff -U0 "$BASE_SHA...$HEAD_SHA" -- CHANGELOG.md | awk -v from="$from" -v to="$to" '
              /^@@/ { split($3, a, ","); line = substr(a[1], 2) + 0; next }
              /^\+\+\+/ { next }
              /^\+/ { if (line >= from && line <= to && substr($0, 2, 2) == "- ") n++; line++; next }
              END { print n + 0 }')
            if [ "$added" -gt 0 ]; then
              echo "CHANGELOG.md adds $added entry line(s) under ## [Unreleased]."
              exit 0
            fi
          fi
          echo "Shipped files changed without a new entry under ## [Unreleased] in CHANGELOG.md:"
          printf '%s\n' "$shipped" | sed 's/^/  /'
          echo "::error title=CHANGELOG.md not updated::This pull request changes shipped files (src/, docs/, Directory.*.props, NUGET.md) but adds no '- ' line under '## [Unreleased]' in CHANGELOG.md. Add one entry there, in the existing heading of its kind (e.g. '### Fixed (CLI)'); see CONTRIBUTING.md#changelog. If the change is not user-visible (CI, tests, an internal refactor), a maintainer adds the 'no-changelog' label instead."
          exit 1
