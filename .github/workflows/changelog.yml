name: Changelog

# A pull request that changes what users get (src/: the packages, the CLI, the analyzers; docs/: the documentation
# site; Directory.Packages.props and Directory.Build.props: the dependencies and build settings of every package;
# NUGET.md files: the package readmes) must add an entry to CHANGELOG.md, an added `- ` line inside `## [Unreleased]`,
# unless a maintainer labels it `no-changelog` (CI, tests, internal refactors, editorial docs passes, a dependency bump
# that changes nothing users get). See CONTRIBUTING.md#changelog.
#
# Adding or removing the label re-runs the check (`labeled` / `unlabeled`). It runs on `pull_request`, never
# `pull_request_target`: fork PRs get a read-only token and no secrets, and the check needs neither.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner: GitHub-hosted ubuntu-latest unless the WINDOWS_RUNNER repository variable names another runner as a JSON
# label array (as in ci.yml), e.g. `gh variable set WINDOWS_RUNNER --body '["self-hosted","Windows"]'`. The check is
# Windows PowerShell 5.1-compatible, so the same script runs under pwsh on ubuntu and under powershell on the Windows
# runner (whose service account can't execute pwsh). While the variable is set, a fork pull request is skipped, so fork
# code never runs on that machine.
jobs:
  changelog:
    if: ${{ !vars.WINDOWS_RUNNER || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    defaults:
      run:
        shell: ${{ vars.WINDOWS_RUNNER && 'powershell' || 'pwsh' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the diff needs the merge base of the PR and its base branch
      - name: CHANGELOG.md updated for shipped changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if ($env:NO_CHANGELOG -eq 'true') {
            Write-Host 'Labelled no-changelog: no entry required.'
            exit 0
          }
          # Three dots: the changes of the PR since it branched, whatever has landed on the base branch since.
          $changed = @(git diff --name-only "$($env:BASE_SHA)...$($env:HEAD_SHA)")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Case-sensitive, as git paths are.
          $shipped = @($changed | Where-Object { $_ -cmatch '^(src|docs)/|^Directory\.(Packages|Build)\.props$|(^|/)NUGET\.md$' })
          if ($shipped.Count -eq 0) {
            Write-Host 'No shipped file changed: no entry required.'
            exit 0
          }
          # The line range of `## [Unreleased]` in the PR head, up to the next `## [` heading.
          $lines = @(git show "$($env:HEAD_SHA):CHANGELOG.md" 2>$null)
          $from = 0; $to = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($from -eq 0) { if ($lines[$i] -cmatch '^## \[Unreleased\]') { $from = $i + 1 } }
            elseif ($lines[$i] -cmatch '^## \[') { $to = $i; break }
          }
          if ($from -gt 0 -and $to -eq 0) { $to = $lines.Count }
          $added = 0
          if ($from -gt 0) {
            # Count the added `- ` lines of the diff that land in that range (new-file line numbers, from the -U0
            # hunk headers).
            $line = 0
            foreach ($d in @(git diff -U0 "$($env:BASE_SHA)...$($env:HEAD_SHA)" -- CHANGELOG.md)) {
              if ($d -cmatch '^@@ -\S+ \+(\d+)') { $line = [int]$Matches[1]; continue }
              if ($d.StartsWith('+++')) { continue }
              if ($d.StartsWith('+')) {
                if ($line -ge $from -and $line -le $to -and $d.Length -ge 3 -and $d.Substring(1, 2) -ceq '- ') { $added++ }
                $line++
              }
            }
          }
          if ($added -gt 0) {
            Write-Host "CHANGELOG.md adds $added entry line(s) under ## [Unreleased]."
            exit 0
          }
          Write-Host 'Shipped files changed without a new entry under ## [Unreleased] in CHANGELOG.md:'
          foreach ($file in $shipped) { Write-Host "  $file" }
          Write-Host "::error title=CHANGELOG.md not updated::This pull request changes shipped files (src/, docs/, Directory.*.props, NUGET.md) but adds no '- ' line under '## [Unreleased]' in CHANGELOG.md. Add one entry there, in the existing heading of its kind (e.g. '### Fixed (CLI)'); see CONTRIBUTING.md#changelog. If the change is not user-visible (CI, tests, an internal refactor), a maintainer adds the 'no-changelog' label instead."
          exit 1
