# Dependency update pull requests. NuGet versions are pinned centrally in Directory.Packages.props (and the Stryker
# tool in .config/dotnet-tools.json). The workflows pin GitHub's own actions (actions/*) by major version, and the
# third-party actions of release.yml (which hold the NuGet OIDC token and the release write token) by full commit SHA
# with a `# vX.Y.Z` comment; Dependabot bumps the SHA and the comment together. Minor and patch updates are grouped
# into one pull request per ecosystem; a major update gets its own.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Stryker is pinned on purpose: the mutation scores move with it, so it is bumped by hand.
    ignore:
      - dependency-name: dotnet-stryker
      # Dependency floor of the shipped framework packages, kept equal to ScaffoldTemplates.CrmCoreAssembliesVersion.
      - dependency-name: Microsoft.CrmSdk.CoreAssemblies
      # Vela.Messages (net10.0) ships it as a floor; above ScaffoldTemplates.DataverseClientVersion, scaffolded
      # solutions fail restore with NU1605. Bumped by hand, with the scaffold constant.
      - dependency-name: Microsoft.PowerPlatform.Dataverse.Client
      # The analyzers compile against the oldest Roslyn they support; a newer one stops them loading in older SDKs/IDEs.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
      # Its major versions require a matching newer Roslyn, and Dependabot then bumps the pinned one with it.
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
        update-types: [version-update:semver-major]
      # Vela.Plugins ships Microsoft.Extensions.DependencyInjection.Abstractions 8.x into the plugin sandbox; a new
      # major is a framework decision. Microsoft.Extensions.DependencyInjection must stay on the same major.
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.DependencyInjection
        update-types: [version-update:semver-major]
      # Pinned to the latest 8.x servicing patch, equal to the versions the vela init scaffold pins
      # (ScaffoldTemplates.CryptographyXmlVersion / CryptographyPkcsVersion). Bumped by hand, with those constants.
      - dependency-name: System.Security.Cryptography.Xml
        update-types: [version-update:semver-major]
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types: [version-update:semver-major]
      # From 1.18.0, Azure.Core pulls Microsoft.Extensions.* 10.x, which conflicts with the 8.x pin above (NU1109).
      - dependency-name: Azure.Identity
        versions: [">= 1.18.0"]
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
