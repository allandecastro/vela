# Dependency update pull requests. NuGet versions are pinned centrally in Directory.Packages.props (and the Stryker
# tool in .config/dotnet-tools.json); the workflows pin third-party actions by major version. Minor and patch updates
# are grouped into one pull request per ecosystem; a major update gets its own.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
